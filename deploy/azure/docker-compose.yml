services:
  api:
    build:
      context: ../..
      dockerfile: services/ingest-api/Dockerfile
    environment:
      AUCTION_API_TOKEN: "${AUCTION_API_TOKEN:?Set AUCTION_API_TOKEN in .env}"
      MARKET_DATA_DIR: /data
    volumes:
      - market-data:/data
    restart: unless-stopped
    networks:
      - market-internal

  web:
    image: caddy:2.9-alpine
    environment:
      MARKET_DOMAIN: "${MARKET_DOMAIN:?Set MARKET_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../apps/market-web:/srv/www:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - market-internal
    restart: unless-stopped
    depends_on:
      - api

networks:
  market-internal:

volumes:
  market-data:
  caddy-data:
  caddy-config:
