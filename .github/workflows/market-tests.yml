name: AuctionMarket tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r services/ingest-api/requirements.txt "numpy>=2,<3" "httpx>=0.27,<1"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q apps/mac-sync services/market-analysis services/ingest-api
      - name: Validate WoW Lua syntax (5.1)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find addons -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
      - name: Exercise addon state transitions with WoW API mock
        run: lua5.1 tests/test_auction_collector.lua
      - name: Validate Azure Compose template
        run: docker compose --env-file deploy/azure/.env.example -f deploy/azure/docker-compose.yml config --quiet
